# DESIGN ONLY. NOT executed in this prototype. Off-host backup server.
Storage {
  Name = flashroom-sd
  SDPort = 9103
  WorkingDirectory = "/var/lib/bacula"
  PidDirectory = "/run/bacula"
  Maximum Concurrent Jobs = 1
}
Director {
  Name = flashroom-dir
  Password = "CHANGE_ME_SD_SECRET"
}
Device {
  Name = FileStorage
  Media Type = File
  Archive Device = /srv/bacula/volumes
  LabelMedia = yes
  Random Access = yes
  AutomaticMount = yes
  RemovableMedia = no
  AlwaysOpen = no
}
Messages {
  Name = Standard
  director = flashroom-dir = all
}
