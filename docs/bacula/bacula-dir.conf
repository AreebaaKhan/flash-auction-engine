# DESIGN ONLY: Linux deployment example. NOT executed by this Windows prototype.
# Replace CHANGE_ME_* consistently and provision the PostgreSQL Bacula catalog.
Director {
  Name = flashroom-dir
  DIRport = 9101
  QueryFile = "/etc/bacula/query.sql"
  WorkingDirectory = "/var/lib/bacula"
  PidDirectory = "/run/bacula"
  Maximum Concurrent Jobs = 1
  Password = "CHANGE_ME_CONSOLE_SECRET"
  Messages = Standard
}
Catalog {
  Name = FlashroomCatalog
  dbname = "bacula"
  dbuser = "bacula"
  dbpassword = "CHANGE_ME_CATALOG_SECRET"
  dbaddress = "127.0.0.1"
}
Client {
  Name = flashroom-fd
  Address = app-server.example.internal
  FDPort = 9102
  Catalog = FlashroomCatalog
  Password = "CHANGE_ME_FD_SECRET"
  File Retention = 60 days
  Job Retention = 6 months
  AutoPrune = yes
}
Storage {
  Name = OffHostFileStorage
  Address = backup-server.example.internal
  SDPort = 9103
  Password = "CHANGE_ME_SD_SECRET"
  Device = FileStorage
  Media Type = File
}
FileSet {
  Name = FlashroomSnapshots
  Include {
    Options { signature = SHA256 }
    # Application's ./backups directory when deployed under /srv/flashroom.
    File = /srv/flashroom/backups
  }
  Exclude { File = /srv/flashroom/data }
}
Schedule {
  Name = WeeklyFullDailyDiffHourlyInc
  Run = Full sun at 01:00
  Run = Differential mon-sat at 01:00
  Run = Incremental hourly at 0:05
}
Pool {
  Name = FlashroomPool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 60 days
  Maximum Volume Bytes = 10G
  Maximum Volumes = 30
  Label Format = "flashroom-"
}
Job {
  Name = BackupFlashroom
  Type = Backup
  Level = Incremental
  Client = flashroom-fd
  FileSet = FlashroomSnapshots
  Schedule = WeeklyFullDailyDiffHourlyInc
  Storage = OffHostFileStorage
  Pool = FlashroomPool
  Messages = Standard
  Priority = 10
  # ClientRunBeforeJob is RunBeforeJob on the File Daemon host. The Director
  # is deliberately on a different backup server, not the application host.
  ClientRunBeforeJob = "/usr/bin/env DB_PATH=/srv/flashroom/data/auction.db /usr/bin/node /srv/flashroom/scripts/backup.js --destination=/srv/flashroom/backups"
}
Job {
  Name = RestoreFlashroom
  Type = Restore
  Client = flashroom-fd
  FileSet = FlashroomSnapshots
  Storage = OffHostFileStorage
  Pool = FlashroomPool
  Messages = Standard
  Where = /srv/flashroom/restore-staging
}
Messages {
  Name = Standard
  console = all, !skipped, !saved
  append = "/var/log/bacula/flashroom.log" = all, !skipped
}
